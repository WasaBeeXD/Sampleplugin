name: Release
on:
  push:
    tags: ["*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x" # Wechsel auf 9, da .NET 10 Runner-Support noch instabil ist

      - name: Build
        run: dotnet build -c Release

      - name: Create Package
        uses: goatcorp/Action-DalamudRelease@master # Direkt vom Master-Zweig
        with:
          project-name: SamplePlugin
