name: Release
on:
  push:
    tags: ["*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x" # Sicherer für den Build-Server

      - name: Build
        run: dotnet build -c Release --output ./publish

      - name: Create Zip
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./latest.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./latest.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
