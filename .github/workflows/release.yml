name: Release

on:
  push:
    tags:
      - "*" # Startet den Build, sobald du einen Tag pushst (z.B. v1.0.0)

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x" # Nutzt dein installiertes .NET 10

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Plugin
        run: dotnet build --configuration Release --no-restore

      - name: Create Release Package
        uses: goatcorp/Action-DalamudRelease@v1
        with:
          project-name: SamplePlugin # Hier EXAKT deinen Projektnamen eintragen
          release-variant: main
          copy-external-viewmodels: false

      - name: Upload Artifacts
        uses: softprops/Action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./latest.zip
