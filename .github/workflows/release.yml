name: Release
on:
  push:
    tags: ["*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Download API 15 Stubs
        shell: pwsh
        run: |
          # Erstelle den Ordner, den wir in der .csproj definiert haben
          New-Item -ItemType Directory -Force -Path ./references
          # Lade die offizielle Dalamud.dll als Referenz (Stub)
          $url = "https://githubusercontent.com"
          Invoke-WebRequest -Uri $url -OutFile ./references/Dalamud.dll

      - name: Build
        # Wir bauen das Projekt und deaktivieren die automatische ZIP-Erstellung vom SDK
        run: dotnet build SamplePlugin.csproj -c Release -p:CreateDalamudPluginZip=false

      - name: Create Package
        shell: pwsh
        run: |
          # Wir suchen die DLL und packen sie mit dem Manifest in die ZIP
          $binPath = "bin/Release/net10.0"
          # Prüfen, ob win-x64 Unterordner existiert
          if (Test-Path "$binPath/win-x64") { $binPath = "$binPath/win-x64" }
          Compress-Archive -Path "$binPath/SamplePlugin.dll", "SamplePlugin.json" -DestinationPath ./latest.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./latest.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
