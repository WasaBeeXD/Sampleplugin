name: Release
on:
  push:
    tags: ["*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Download Dalamud Assets
        shell: pwsh
        run: |
          # Wir laden die Stubs von Goatcorp herunter
          $url = "https://githubusercontent.com"
          New-Item -ItemType Directory -Force -Path ./references
          Invoke-WebRequest -Uri $url -OutFile ./references/Dalamud.dll

      - name: Build Plugin
        run: dotnet build -c Release --output ./publish -p:DalamudLibPath=./references

      - name: Create Zip
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath ./latest.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./latest.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
