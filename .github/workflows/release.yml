name: Release
on:
  push:
    tags: ["*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Wir geben keine exakte Build-Nummer an, damit er nimmt, was da ist
          dotnet-version: "10.0.x"
          dotnet-quality: "preview" # Zwingend erforderlich für .NET 10 Preview

      - name: Build
        run: dotnet build SamplePlugin.csproj -c Release --output ./publish -p:DalamudLibPath=$HOME/.dalamud/6.2.1/

      - name: Create Zip
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./latest.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./latest.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
